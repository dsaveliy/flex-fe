name: Frontend CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: docker build --target local --build-arg EXPO_PUBLIC_API_URL=/api/v1 -t flex-web:ci .

  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ inputs.version || github.ref_name }}
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
    steps:
      - name: Validate release version
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_VERSION }}
          persist-credentials: false
      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish release image
        run: |
          image="${IMAGE_REPOSITORY,,}:$RELEASE_VERSION"
          revision="$(git rev-parse HEAD)"
          docker build --platform linux/amd64 --target local --build-arg EXPO_PUBLIC_API_URL=/api/v1 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$revision" \
            --label "org.opencontainers.image.version=$RELEASE_VERSION" \
            --tag "$image" .
          docker push "$image"
